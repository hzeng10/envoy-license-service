spring:
  application:
    name: envoy-license-service

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

license:
  rules-file: /etc/license/license-rules.yml
  watch-interval-seconds: 5
  grpc-port: 9191
  grpc-reflection: false

logging:
  level:
    com.example.license: INFO
    io.grpc: WARN
