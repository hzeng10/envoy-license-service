# httpbin 测试工作负载：用于验证 ext_authz 拦截是否生效
# sidecar.istio.io/inject: "true" 必须设置为 Pod 标签（不是注解），
# 否则 Istio mutating webhook 的 objectSelector 无法匹配，sidecar 不会被注入
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: default
  labels:
    app: httpbin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
  template:
    metadata:
      labels:
        app: httpbin
        sidecar.istio.io/inject: "true"  # Pod 标签，触发 Istio sidecar 自动注入（2/2 READY）
    spec:
      containers:
        - name: httpbin
          image: kennethreitz/httpbin
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
# httpbin ClusterIP Service，ext_authz 测试时通过此地址访问
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: default
  labels:
    app: httpbin
spec:
  selector:
    app: httpbin
  ports:
    - name: http
      port: 80
      targetPort: 80
