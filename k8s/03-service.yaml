# 许可证校验服务 ClusterIP Service
# 端口 9191 供 EnvoyFilter 的 ext_authz cluster 引用；端口 8080 供存活/就绪探针和 Prometheus 抓取
apiVersion: v1
kind: Service
metadata:
  name: license-validation-service
  namespace: default
  labels:
    app: license-validation-service
spec:
  selector:
    app: license-validation-service
  type: ClusterIP
  ports:
    - name: grpc             # gRPC ext_authz 端口，appProtocol 告知 Envoy 使用 HTTP/2
      port: 9191
      targetPort: 9191
      protocol: TCP
      appProtocol: grpc
    - name: http-management  # actuator 管理端口
      port: 8080
      targetPort: 8080
      protocol: TCP
