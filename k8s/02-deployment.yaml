apiVersion: apps/v1
kind: Deployment
metadata:
  name: license-validation-service
  namespace: default
  labels:
    app: license-validation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: license-validation-service
  template:
    metadata:
      labels:
        app: license-validation-service
      annotations:
        # No sidecar — the ext_authz server is not a mesh workload
        sidecar.istio.io/inject: "false"
        # Exclude the ext_authz service itself from ext_authz checks to avoid a loop
        traffic.sidecar.istio.io/excludeOutboundPorts: "9191"
    spec:
      containers:
        - name: license-validation-service
          image: license-validation-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 9191
              protocol: TCP
            - name: http-management
              containerPort: 8080
              protocol: TCP
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseZGC -XX:+ZGenerational -Xms64m -Xmx160m -XX:MaxMetaspaceSize=80m -XX:ReservedCodeCacheSize=32m -XX:MaxDirectMemorySize=32m"
            - name: LICENSE_GRPC_REFLECTION
              value: "true"
            - name: LICENSE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: license-secret
                  key: token
                  optional: true
          volumeMounts:
            - name: license-rules
              mountPath: /etc/license
              readOnly: true
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "384Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: license-rules
          configMap:
            name: license-rules
