# 许可证校验服务 Deployment
# 注意：此 Pod 不注入 Istio sidecar，以避免 ext_authz 自我调用形成死循环
apiVersion: apps/v1
kind: Deployment
metadata:
  name: license-validation-service
  namespace: default
  labels:
    app: license-validation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: license-validation-service
  template:
    metadata:
      labels:
        app: license-validation-service
      annotations:
        # 禁止 Istio 注入 sidecar——ext_authz 服务器不是网格内工作负载
        sidecar.istio.io/inject: "false"
        # 防止出站流量经过 9191 端口被拦截，避免自我授权死循环
        traffic.sidecar.istio.io/excludeOutboundPorts: "9191"
    spec:
      containers:
        - name: license-validation-service
          image: license-validation-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc             # gRPC ext_authz 服务端口
              containerPort: 9191
              protocol: TCP
            - name: http-management  # actuator 健康检查和 Prometheus 指标端口
              containerPort: 8080
              protocol: TCP
          env:
            # JVM 调优：使用 ZGC（低延迟 GC），限制堆和非堆大小以适配 384Mi 容器
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseZGC -XX:+ZGenerational -Xms64m -Xmx160m -XX:MaxMetaspaceSize=80m -XX:ReservedCodeCacheSize=32m -XX:MaxDirectMemorySize=32m"
            # 开启 gRPC 服务反射，方便使用 grpcurl 调试
            - name: LICENSE_GRPC_REFLECTION
              value: "true"
            # 从 Secret 注入 Token 值（optional=true：Secret 不存在时使用 YAML 中的默认值）
            - name: LICENSE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: license-secret
                  key: token
                  optional: true
          volumeMounts:
            - name: license-rules
              mountPath: /etc/license  # ConfigMap 挂载路径，服务从此处读取规则文件
              readOnly: true
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "384Mi"  # 需 384Mi：堆 160M + Metaspace 80M + 代码缓存 32M + 直接内存 32M + 线程栈
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 15  # 等待 JVM 启动完成后再探测
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: license-rules
          configMap:
            name: license-rules  # 引用 01-configmap.yaml 中的 ConfigMap
